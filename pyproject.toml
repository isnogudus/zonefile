[project]
name = "zonefile"
version = "1.0.0"
description = "A Python tool for generating DNS zone files from TOML configuration files"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "zonefile contributors"}
]
keywords = ["dns", "zonefile", "unbound", "nsd", "toml"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.scripts]
zonefile = "zonefile:main"

[project.urls]
Homepage = "https://github.com/isnogudus/zonefile"
Repository = "https://github.com/isnogudus/zonefile"
Issues = "https://github.com/isnogudus/zonefile/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[tool.black]
line-length = 135

[tool.pyright]
typeCheckingMode = "strict"

